# yaml-language-server: $schema=../../rin-schema.json
rin: tohsaka
name: my-team
version: 0.1.1

messaging:
  timeout: 30m
  maxHops: 5

agents:
  - id: rin
    type: leader
    label: Chief Architect
    harness: claude-code
    authentication: subscription
    model: claude-opus-5-5
    maxSessions: 3
    resources:
      cpus: 1
      ram: 2g

  - id: backend
    type: member
    label: Backend Engineer
    harness: codex
    authentication: subscription
    model: gpt-6-luna
    resources:
      cpus: 1
      ram: 2g

  - id: frontend
    type: member
    label: Frontend Engineer
    harness: antigravity
    authentication: subscription
    model: gemini-3.8-flash
    resources:
      cpus: 1
      ram: 2g

  - id: devops
    type: member
    label: Devops Engineer
    harness: pi
    authentication: apiKey
    model: ollama/inkling-2-small
    resources:
      cpus: 1
      ram: 2g
