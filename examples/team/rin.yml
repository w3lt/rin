# yaml-language-server: $schema=../../rin-schema.json
rin: tohsaka
name: my-team # team name: folder in $RIN_HOME, Compose project rin-my-team
version: 0.1.1 # the rin version everyone on this team must use

messaging:
  timeout: 30m # how long a sender waits for a reply
  maxHops: 5 # longest chain of agent → agent messages

agents:
  - id: rin
    type: leader
    label: Chief Architect
    harness: claude-code
    authentication: subscription
    model: claude-opus-5-5
    maxSessions: 3 # parallel delegated sessions (default 3)
    resources: { cpus: 2, ram: 4g }

  - id: backend
    type: member
    label: Backend Engineer
    harness: pi
    authentication: apiKey
    model: anthropic/claude-sonnet-5-5
    resources: { cpus: 2, ram: 4g }

  - id: frontend
    type: member
    label: Frontend Engineer
    harness: codex
    authentication: subscription
    model: gpt-5-codex
    resources: { cpus: 2, ram: 4g }
