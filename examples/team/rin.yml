# yaml-language-server: $schema=../../rin-schema.json
rin: tohsaka
name: my-team
version: 0.1.1

messaging:
  timeout: 30m
  maxHops: 5

agents:
  - id: rin
    type: leader
    label: Chief Architect
    harness: claude-code
    authentication: subscription
    model: claude-opus-5-5
    maxSessions: 3
    resources: { cpus: 2, ram: 4g }

  - id: backend
    type: member
    label: Backend Engineer
    harness: pi
    authentication: apiKey
    model: anthropic/claude-sonnet-5-5
    resources: { cpus: 2, ram: 4g }

  - id: frontend
    type: member
    label: Frontend Engineer
    harness: codex
    authentication: subscription
    model: gpt-5-codex
    resources: { cpus: 2, ram: 4g }
