name: Publish crate on crates.io & Release binaries

on:
  push:
    tags:
      - "v*.*.*"
  # Build a tag that already exists, e.g. one pushed before this workflow did.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CRATE_NAME: tohsaka

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version'
          )"

          if [[ -z "$CARGO_VERSION" ]]; then
            echo "Could not find package named '$CRATE_NAME' in cargo metadata" >&2
            exit 1
          fi

          echo "Git tag:      $TAG_VERSION"
          echo "Cargo.toml:   $CARGO_VERSION"

          test "$TAG_VERSION" = "$CARGO_VERSION"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      # The images build exactly this (images/Dockerfile); with every feature
      # on, a feature gate that breaks it would go unnoticed until `rin up`.
      - name: Check the build the images use
        run: cargo check --locked --no-default-features --features hub,agent

      - name: Package dry run
        run: cargo publish --dry-run --locked --package "$CRATE_NAME"

  publish-crate:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crate
        run: cargo publish --locked --package "$CRATE_NAME"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Static (musl), so the binary does not depend on the host's glibc.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }

    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: tar -czf "rin-$TARGET.tar.gz" -C "target/$TARGET/release" rin -C "$PWD" LICENSE-MIT LICENSE-APACHE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rin-${{ matrix.target }}
          path: rin-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Check the packaged binary is this version
        run: |
          set -euo pipefail

          tar -xzf rin-x86_64-unknown-linux-musl.tar.gz rin
          test "$(./rin --version)" = "rin ${TAG#v}"

      - name: Upload to the GitHub release
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" rin-*.tar.gz --clobber
          else
            gh release create "$TAG" rin-*.tar.gz --verify-tag --generate-notes
          fi

  update-tap:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: release

    env:
      FORMULA: Formula/rin.rb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3lt/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Write the formula
        working-directory: tap
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          CURRENT="$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "$FORMULA" || true)"
          CURRENT="${CURRENT#v}"

          if [[ -z "$CURRENT" ]]; then
            echo "No version found in $FORMULA, update it by hand" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
            echo "Tap is at $CURRENT, newer than $VERSION; leaving it alone"
            exit 0
          fi

          sha() { sha256sum "../dist/rin-$1.tar.gz" | cut -d' ' -f1; }
          MACOS_ARM="$(sha aarch64-apple-darwin)"
          LINUX_INTEL="$(sha x86_64-unknown-linux-musl)"
          LINUX_ARM="$(sha aarch64-unknown-linux-musl)"

          INSTALL='bin.install "rin"'
          tar -xzf ../dist/rin-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP" rin
          if "$RUNNER_TEMP/rin" completions bash > /dev/null 2>&1; then
            INSTALL+=$'\n    generate_completions_from_executable(bin/"rin", "completions")'
          fi

          REPO="https://github.com/$GITHUB_REPOSITORY"
          BASE="$REPO/releases/download/$TAG"

          cat > "$FORMULA" <<EOF
          class Rin < Formula
            desc "Deploy and manage your team of AI agents"
            homepage "$REPO"
            version "$VERSION"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              depends_on arch: :arm64

              url "$BASE/rin-aarch64-apple-darwin.tar.gz"
              sha256 "$MACOS_ARM"
            end

            on_linux do
              on_arm do
                url "$BASE/rin-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$LINUX_ARM"
              end

              on_intel do
                url "$BASE/rin-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$LINUX_INTEL"
              end
            end

            deny_network_access!

            def install
              $INSTALL
            end

            test do
              assert_match(/usage:/i, shell_output("#{bin}/rin --help"))
            end
          end
          EOF

          if git diff --quiet; then
            echo "Tap already at $VERSION"
            exit 0
          fi

          git diff
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "rin $VERSION"
          git push origin HEAD:main
