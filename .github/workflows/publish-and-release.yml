name: Publish crate on crates.io & Release binaries

on:
  push:
    tags:
      - "v*.*.*"
  # Build a tag that already exists, e.g. one pushed before this workflow did.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version'
          )"

          if [[ -z "$CARGO_VERSION" ]]; then
            echo "Could not find package named '$CRATE_NAME' in cargo metadata" >&2
            exit 1
          fi

          echo "Git tag:      $TAG_VERSION"
          echo "Cargo.toml:   $CARGO_VERSION"

          test "$TAG_VERSION" = "$CARGO_VERSION"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      # The images build exactly this (images/Dockerfile); with every feature
      # on, a feature gate that breaks it would go unnoticed until `rin up`.
      - name: Check the build the images use
        run: cargo check --locked --no-default-features --features hub,agent

      - name: Package dry run
        run: cargo publish --dry-run --locked --package "$CRATE_NAME"

  publish-crate:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crate
        run: cargo publish --locked --package "$CRATE_NAME"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Static (musl), so the binary does not depend on the host's glibc.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }

    env:
      TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable
        run: |
          set -euo pipefail

          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: tar -czf "rin-$TARGET.tar.gz" -C "target/$TARGET/release" rin -C "$PWD" LICENSE-MIT LICENSE-APACHE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rin-${{ matrix.target }}
          path: rin-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Check the packaged binary is this version
        run: |
          set -euo pipefail

          tar -xzf rin-x86_64-unknown-linux-musl.tar.gz rin
          test "$(./rin --version)" = "rin ${TAG#v}"

      - name: Upload to the GitHub release
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" rin-*.tar.gz --clobber
          else
            gh release create "$TAG" rin-*.tar.gz --verify-tag --generate-notes
          fi

  update-tap:
    name: Update the Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    environment: release

    env:
      FORMULA: Formula/rib.rb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: w3lt/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Bump the formula
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          CURRENT="$(sed -nE 's|^  url ".*/refs/tags/v([^"]+)\.tar\.gz"$|\1|p' "$FORMULA")"

          if [[ -z "$CURRENT" ]]; then
            echo "No tag archive url found in $FORMULA, update it by hand" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
            echo "Tap is at $CURRENT, newer than $VERSION; leaving it alone"
            exit 0
          fi

          URL="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz"
          SHA256="$(curl -fsSL --retry 3 "$URL" | sha256sum | cut -d' ' -f1)"

          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$URL\"|" \
            -e "s|^  sha256 \"[0-9a-f]{64}\"$|  sha256 \"$SHA256\"|" \
            "$FORMULA"

          grep -qxF "  url \"$URL\"" "$FORMULA"
          grep -qxF "  sha256 \"$SHA256\"" "$FORMULA"

          if git diff --quiet; then
            echo "Tap already at $VERSION"
            exit 0
          fi

          git diff
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "rin $VERSION"
          git push origin HEAD:main
